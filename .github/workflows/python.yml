name: Python QA

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Ruff Lint and Check-Format
        uses: astral-sh/ruff-action@v3
        with:
          args: check --diff
